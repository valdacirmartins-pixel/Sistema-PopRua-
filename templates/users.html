{% extends 'base.html' %}{% block content %}<h1>Equipe e permissões</h1><div class="panel"><h2>Criar profissional</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="fields"><label>Nome<input name="name" required></label><label>E-mail profissional<input name="email" type="email" required></label><label>Senha inicial (mín. 14 caracteres)<input name="password" type="password" minlength="14" required></label><label>Perfil<select name="role"><option value="atendente">Atendente</option><option value="leitor">Leitor</option><option value="gestor">Gestor</option></select></label><label>Unidade<select name="unit_id" required>{% for u in units %}<option value="{{u.id}}">{{u.name}} — {{u.city}}/{{u.uf}}</option>{% endfor %}</select></label></div><button class="primary">Criar usuário</button></form></div><div class="panel tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{'Ativo' if u.active else 'Inativo'}}</td><td>{% if u.id!=me.id %}<form method="post" action="{{url_for('toggle_user',user_id=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>{{'Desativar' if u.active else 'Ativar'}}</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
