{% extends 'base.html' %}{% block content %}<h1>Unidades de atendimento</h1><div class="panel"><h2>Adicionar unidade</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="fields"><label>Nome da unidade<input name="name" required></label><label>Município<input name="city" required></label><label>UF<select name="uf" required>{% for uf in ufs %}<option>{{uf}}</option>{% endfor %}</select></label></div><button class="primary">Cadastrar unidade</button></form></div><div class="panel tablewrap"><table><thead><tr><th>Unidade</th><th>Município</th><th>UF</th><th>Status</th></tr></thead><tbody>{% for u in units %}<tr><td>{{u.name}}</td><td>{{u.city}}</td><td>{{u.uf}}</td><td>{{'Ativa' if u.active else 'Inativa'}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
