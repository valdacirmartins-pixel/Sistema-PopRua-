{% extends 'base.html' %}{% block content %}<h1>Novo atendimento</h1><p>Pessoa: <strong>{{data.get('nome_social') or data.get('nome_registro')}}</strong></p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for section,items in attendance_fields.items() %}<fieldset class="panel"><legend>{{section}}</legend><div class="fields">{% for key,label,kind in items %}<label class="{% if kind=='textarea' %}wide{% endif %}">{{label}}{% if kind.startswith('choice:') %}<select name="{{key}}"><option value="">Selecione</option>{% for option in kind[7:].split('|') %}<option value="{{option}}">{{option}}</option>{% endfor %}</select>{% elif kind=='textarea' %}<textarea name="{{key}}" rows="4" maxlength="3500"></textarea>{% else %}<input name="{{key}}" type="{{kind}}" maxlength="300">{% endif %}</label>{% endfor %}</div></fieldset>{% endfor %}<button class="primary">Salvar atendimento</button></form>{% endblock %}
